name: headless-conformance

on:
  push:
    branches: [master, main, phase-216-*]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: sudo apt-get install -y unzip
      - name: Run headless conformance
        run: bash scripts/ci.sh
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: .bin/ci.log
